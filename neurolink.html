<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sate Haddadin — NeuroLink Architecture</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#F7F6F2',
          panel: '#FFFFFF',
          hairline: '#E4E2DD',
          accent: '#3B6FE0',
          ink: '#14161A',
          muted: '#6B7075',
        },
        fontFamily: {
          mono: ['"JetBrains Mono"', 'monospace'],
          serif: ['"Fraunces"', 'serif'],
        },
      },
    },
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #F7F6F2;
  }

  /* The designated workspace below your header */
  #viewport-wrapper {
    position: absolute;
    top: 80px;
    left: 0;
    width: 100vw;
    height: calc(100vh - 80px);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 24px; /* Adds an exact, uniform gap around the edges */
    box-sizing: border-box;
  }

  /* Dynamically scales to fill the padded wrapper completely */
  #architecture-canvas {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid #E4E2DD;
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(20, 22, 26, 0.12);
    cursor: grab;
    object-fit: contain;
    background: #FFFFFF;
  }

  #architecture-canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body class="bg-bg text-ink font-sans antialiased">

<div class="grid-bg"></div>

<header class="fixed top-0 left-0 w-full h-[80px] border-b border-hairline bg-bg/80 backdrop-blur-md z-50 flex items-center justify-between px-6 md:px-10">
  <a href="index.html" class="font-mono text-xs tracking-wide text-muted hover:text-ink border border-hairline bg-panel px-4 py-2 rounded-md transition-colors" data-magnetic>
    ← Back to portfolio
  </a>
  <div class="font-mono text-[10px] text-muted tracking-wide hidden sm:flex items-center gap-2 bg-panel border border-hairline px-3 py-1.5 rounded-md">
    <span class="status-dot"></span> Interactive canvas
  </div>
</header>

<main id="viewport-wrapper">
  <img id="architecture-canvas" src="architecture.png" alt="NeuroLink Production RAG Pipeline Blueprint" />
</main>

<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-panel border border-hairline p-1.5 rounded-lg backdrop-blur-md shadow-lg">
  <button id="zoom-out-ctrl" class="w-10 h-10 font-mono text-base text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">-</button>
  <div class="w-px h-4 bg-hairline"></div>
  <button id="reset-ctrl" class="px-3 h-10 font-mono text-xs tracking-wide text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">Reset</button>
  <div class="w-px h-4 bg-hairline"></div>
  <button id="zoom-in-ctrl" class="w-10 h-10 font-mono text-base text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">+</button>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Magnetic hover for the back link, consistent with the main site
    const magnet = document.querySelector('[data-magnetic]');
    if (magnet && !window.matchMedia('(max-width: 768px)').matches) {
      const setX = gsap.quickTo(magnet, 'x', { duration: 0.5, ease: 'power3.out' });
      const setY = gsap.quickTo(magnet, 'y', { duration: 0.5, ease: 'power3.out' });

      magnet.addEventListener('mousemove', (e) => {
        const rect = magnet.getBoundingClientRect();
        const relX = e.clientX - (rect.left + rect.width / 2);
        const relY = e.clientY - (rect.top + rect.height / 2);
        setX(relX * 0.35);
        setY(relY * 0.35);
      });
      magnet.addEventListener('mouseleave', () => {
        setX(0);
        setY(0);
      });
    }

    // High Performance Panzoom Setup
    const elem = document.getElementById('architecture-canvas');
    const wrapper = document.getElementById('viewport-wrapper');

    const pz = Panzoom(elem, {
      maxScale: 6,
      minScale: 0.3,
      step: 0.2
    });

    wrapper.addEventListener('wheel', pz.zoomWithWheel);
    document.getElementById('zoom-in-ctrl').addEventListener('click', pz.zoomIn);
    document.getElementById('zoom-out-ctrl').addEventListener('click', pz.zoomOut);

    document.getElementById('reset-ctrl').addEventListener('click', () => {
      pz.reset();
    });
  });
</script>
</body>
</html>
