<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sate Haddadin — NeuroLink Architecture</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#12151B',
          panel: '#1B2028',
          hairline: '#28303D',
          accent: '#0099FF',
          ink: '#F1F5F9',
          muted: '#94A3B8',
        },
        fontFamily: {
          mono: ['"JetBrains Mono"', 'monospace'],
          serif: ['"Space Grotesk"', 'sans-serif'],
          sans: ['"Inter"', 'sans-serif'],
        },
      },
    },
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

<link rel="stylesheet" href="style.css?v=4" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #12151B;
  }

  /* The designated workspace below your header */
  #viewport-wrapper {
    position: absolute;
    top: 80px;
    left: 0;
    width: 100vw;
    height: calc(100vh - 80px);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 24px; /* Adds an exact, uniform gap around the edges */
    box-sizing: border-box;
  }

  /* Dynamically scales to fill the padded wrapper completely */
  #architecture-canvas {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid #28303D;
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    cursor: grab;
    object-fit: contain;
    background: #1B2028;
  }

  #architecture-canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body class="bg-bg text-ink font-sans antialiased">

<div class="grid-bg"></div>

<header class="fixed top-0 left-0 w-full h-[80px] border-b border-hairline bg-bg/80 backdrop-blur-md z-50 flex items-center justify-between px-6 md:px-10">
  <a href="index.html" class="font-mono text-xs tracking-wide text-muted hover:text-ink border border-hairline bg-panel px-4 py-2 rounded-md transition-colors" data-magnetic>
    ← Back to portfolio
  </a>
  <div class="flex items-center gap-3">
    <div class="font-mono text-[10px] text-muted tracking-wide hidden sm:flex items-center gap-2 bg-panel border border-hairline px-3 py-1.5 rounded-md">
      <span class="status-dot"></span> Interactive canvas
    </div>
    <button id="menu-btn" type="button" class="md:hidden border border-hairline bg-panel rounded-md p-2 text-muted hover:text-ink transition-colors" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <svg id="menu-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg id="menu-icon-close" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
  </div>

  <!-- Mobile menu (hamburger) -->
  <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-bg border-b border-hairline shadow-lg">
    <nav class="max-w-7xl mx-auto px-6 py-2 flex flex-col font-mono text-sm tracking-wide text-muted">
      <a href="index.html#experience" class="py-3 hover:text-ink transition-colors border-b border-hairline/70">Experience</a>
      <a href="index.html#projects" class="py-3 hover:text-ink transition-colors border-b border-hairline/70">Projects</a>
      <a href="projects.html" class="py-3 hover:text-ink transition-colors border-b border-hairline/70">All projects</a>
      <a href="index.html#education" class="py-3 hover:text-ink transition-colors border-b border-hairline/70">Education</a>
      <a href="index.html#contact" class="py-3 hover:text-ink transition-colors">Contact</a>
    </nav>
  </div>
</header>

<main id="viewport-wrapper">
  <img id="architecture-canvas" src="architecture.png" alt="NeuroLink Production RAG Pipeline Blueprint" />
</main>

<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-panel border border-hairline p-1.5 rounded-lg backdrop-blur-md shadow-lg">
  <button id="zoom-out-ctrl" class="w-10 h-10 font-mono text-base text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">-</button>
  <div class="w-px h-4 bg-hairline"></div>
  <button id="reset-ctrl" class="px-3 h-10 font-mono text-xs tracking-wide text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">Reset</button>
  <div class="w-px h-4 bg-hairline"></div>
  <button id="zoom-in-ctrl" class="w-10 h-10 font-mono text-base text-muted hover:text-ink hover:border-accent/40 border border-transparent rounded-md transition-all flex items-center justify-center bg-bg">+</button>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Magnetic hover for the back link, consistent with the main site
    const magnet = document.querySelector('[data-magnetic]');
    if (magnet && !window.matchMedia('(max-width: 768px)').matches) {
      const setX = gsap.quickTo(magnet, 'x', { duration: 0.5, ease: 'power3.out' });
      const setY = gsap.quickTo(magnet, 'y', { duration: 0.5, ease: 'power3.out' });

      magnet.addEventListener('mousemove', (e) => {
        const rect = magnet.getBoundingClientRect();
        const relX = e.clientX - (rect.left + rect.width / 2);
        const relY = e.clientY - (rect.top + rect.height / 2);
        setX(relX * 0.35);
        setY(relY * 0.35);
      });
      magnet.addEventListener('mouseleave', () => {
        setX(0);
        setY(0);
      });
    }

    // High Performance Panzoom Setup
    const elem = document.getElementById('architecture-canvas');
    const wrapper = document.getElementById('viewport-wrapper');

    const pz = Panzoom(elem, {
      maxScale: 6,
      minScale: 0.3,
      step: 0.2
    });

    wrapper.addEventListener('wheel', pz.zoomWithWheel);
    document.getElementById('zoom-in-ctrl').addEventListener('click', pz.zoomIn);
    document.getElementById('zoom-out-ctrl').addEventListener('click', pz.zoomOut);

    document.getElementById('reset-ctrl').addEventListener('click', () => {
      pz.reset();
    });
  });
</script>
<script src="menu.js"></script>
</body>
</html>
